<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">BrewLite | Kiến trúc local</title><desc id="desc">Frontend Next.js và backend NestJS chạy bằng Node trên host. PostgreSQL chạy trong Docker, cổng host 5433 ánh xạ cổng container 5432. Thanh toán mô phỏng nằm trong backend.</desc>
