<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="678" viewBox="0 0 1120 678" role="img" aria-labelledby="title desc">
<title id="title">Assignment 2 | CI và CD cần hoàn thiện</title><desc id="desc">CI cho pull request gồm install lint unit test build và required merge gate. CD sau push hoặc tag gồm build image, kiểm thử container, registry, migration, deploy, smoke test và ghi nhận bản phát hành hoặc rollback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315e50"/></marker></defs>
